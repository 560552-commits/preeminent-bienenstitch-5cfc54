  .farm-col{flex-shrink:0;text-align:right;}

function todayStr(){

  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function tomorrowStr(){

  d.setDate(d.getDate()+1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function scrollToBottom(){

  });

function formatWorkTime(raw){
  if(raw === null || raw === undefined || raw === '') return null;
  const s = String(raw).trim();
  const m = s.match(/(\d+)\s*시\s*(\d+)?\s*분?/);
  if(m){
    const hour = m[1];
    const min = m[2] ? m[2].padStart(2, '0') : '00';
    return hour + ':' + min;
  }
  const n = s.match(/^(\d+)$/);
  if(n){
    return n[1] + ':00';
  }
  return s;
}

function fmtWeight(w){

function dateToStr(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

async function handleExcelFile(file){
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const sheetName = wb.SheetNames.find(n => n.trim() === '배차') || wb.SheetNames[0];
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });

    if(ws['!rows']){
      ws['!rows'].forEach((rowMeta, idx) => {
        if(rowMeta && rowMeta.hidden && rows[idx]){
          rows[idx] = [];
        }
      });
    }

    const parsed = parseDispatchSheet(rows);

    if(!parsed.farms.length){
      alert('농가 정보를 인식하지 못했습니다. 파일 형식을 확인해주세요.');
      return;
    }

    state.excelImport = {
      date: parsed.detectedDate ? dateToStr(parsed.detectedDate) : state.farmDate,
      farms: parsed.farms
    };
    render();
  }catch(e){
    console.error('excel read error', e);
    alert('엑셀 파일을 읽는 중 문제가 발생했습니다. .xlsx 파일인지 확인해주세요.');
  }
}

const KNOWN_TAG_WORDS = new Set(['G마크', '무항생제', '일반', '동물복지', '삼계', '육계']);

function findReconnectTarget(str, knownNames){
  if(!str) return null;
  const s = String(str).trim();
  const m = s.match(/^(.+?)\s*연결\s*작업?/);
  if(!m) return null;
  const candidate = m[1].trim();
  if(!candidate) return null;
  if(knownNames.includes(candidate)) return candidate;
  return knownNames.find(n => candidate.includes(n) || n.includes(candidate)) || null;
}

function parseDispatchSheet(rows){
  const cell = (r, c) => (rows[r] && rows[r][c] !== undefined) ? rows[r][c] : null;

  let headerIdx = rows.findIndex(r => r && r[0] === 'No');
  if(headerIdx === -1) headerIdx = 2;
  const dataStart = headerIdx + 1;

  let detectedDate = null;
  for(let i = 0; i < headerIdx && !detectedDate; i++){
    const row = rows[i];
    if(!row) continue;
    for(const c of row){
      if(c instanceof Date){ detectedDate = c; break; }
    }
  }
  if(!detectedDate){
    for(let i = 0; i < headerIdx && !detectedDate; i++){
      const row = rows[i];
      if(!row) continue;
      for(const c of row){
        if(typeof c !== 'string') continue;
        const m = c.match(/(?:(\d{2,4})\s*년\s*)?(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
        if(m){
          let y = m[1] ? parseInt(m[1], 10) : new Date().getFullYear();
          if(y < 100) y += 2000;
          const mo = parseInt(m[2], 10);
          const d = parseInt(m[3], 10);
          detectedDate = new Date(y, mo - 1, d);
          break;
        }
      }
    }
  }

  const farmsByName = {};
  const farmOrder = [];
  let current = null;

  let i = dataStart;
  const n = rows.length;

  while(i < n){
    const name = cell(i, 2);
    const region = cell(i, 4);
    const count = cell(i, 6);
    const weight = cell(i, 8);
    const nameStr = name ? String(name).trim() : '';

    const isHeader = !!nameStr && !KNOWN_TAG_WORDS.has(nameStr) &&
      (region !== null || count !== null || weight !== null);

    if(isHeader){
      const tagCandidates = [cell(i + 1, 2), cell(i + 2, 2)];
      let premium = '일반';
      let animalWelfare = false;
      let chickenType = '육계';
      tagCandidates.forEach(t => {
        if(!t) return;
        const s = String(t);
        if(s.includes('G마크')) premium = 'G마크';
        if(s.includes('무항생제')) premium = '무항생제';
        if(s.includes('동물복지')) animalWelfare = true;
        if(s.includes('삼계')) chickenType = '삼계';
        if(s.includes('육계')) chickenType = '육계';
      });
      const lineRaw = cell(i + 1, 1);

      const farm = {
        name: nameStr,
        line: (lineRaw === '1라인' || lineRaw === '2라인') ? lineRaw : '2라인',
        premium,
        animalWelfare,
        chickenType,
        avgWeight: (weight !== null && weight !== undefined && weight !== '') ? parseFloat(weight) : null,
        targetCount: (count !== null && count !== undefined && count !== '') ? parseInt(count, 10) : null,
        transportRoute: (cell(i, 7) !== null && cell(i, 7) !== undefined && cell(i, 7) !== '') ? String(cell(i, 7)).trim() : null,
        workTime: (cell(i, 11) !== null && cell(i, 11) !== undefined && cell(i, 11) !== '') ? String(cell(i, 11)).trim() : null,
        vehicles: []
      };
      farmsByName[nameStr] = farm;
      farmOrder.push(farm);
      current = farm;
    } else {
      for(let c = 1; c <= 8; c++){
        const target = findReconnectTarget(cell(i, c), Object.keys(farmsByName));
        if(target){ current = farmsByName[target]; break; }
      }
    }

    if(current){
      const code = cell(i, 9);
      const num = cell(i, 10);
      if(code && num !== null && num !== '' && num !== undefined){
        current.vehicles.push({ code: String(code).trim(), number: String(num).trim() });
      }
    }

    i++;
  }

  return { detectedDate, farms: farmOrder };
}

async function storageGet(key, shared, fallback){
  try{
    const path = key.replace(':', '/');
    const snap = await db.ref(path).once('value');
    const val = snap.val();
    return (val === null || val === undefined) ? fallback : val;
  }catch(e){
    console.error('firebase get error', key, e);
    return fallback;
  }
}
async function storageSet(key, value, shared){
  try{
    const path = key.replace(':', '/');
    await db.ref(path).set(value);
    return true;
  }catch(e){
    console.error('firebase set error', key, e);
    return false;
  }
}

async function loadVehicles(){
  const stored = await storageGet('vehicles', true, null);
  if(stored && Object.keys(stored).length){
    state.vehicles = stored;
  } else {
    state.vehicles = { ...SEED_VEHICLES };
    await saveVehicles();
  }
}
async function saveVehicles(){
  await storageSet('vehicles', state.vehicles, true);
}
async function loadFarms(date){
  state.farms = await storageGet('farms:' + date, true, []);

async function saveFarms(date, farms){
  return await storageSet('farms:' + date, farms, true);
}
function normalizeEntry(e){
  return {
    ...e,
    injectOrder: (e.injectOrder === undefined) ? null : e.injectOrder,
    weight: (e.weight === undefined) ? null : e.weight,
    waitState: e.waitState || '바닥',
    inspected: !!e.inspected,
    animalWelfare: !!e.animalWelfare
  };
}

async function loadEntries(date){
  const raw = await storageGet('entries:' + date, true, []);
  state.entries = (raw || []).map(normalizeEntry);
}
async function saveEntries(date, entries){
  await storageSet('entries:' + date, entries, true);
}
async function loadClosed(date){
  const raw = await storageGet('closed:' + date, true, null);
  state.closedByLine = {
    '1라인': !!(raw && raw['1라인']),
    '2라인': !!(raw && raw['2라인'])
  };
}
async function saveClosed(date, value){
  return await storageSet('closed:' + date, value, true);
}

function h(strings, ...vals){
  return strings.reduce((acc, s, i) => acc + s + (vals[i] !== undefined ? vals[i] : ''), '');
}
function esc(str){
  return String(str === undefined || str === null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  else if(state.view === 'confirmInject') app.innerHTML = viewConfirmInject();
  else if(state.view === 'adminMain') app.innerHTML = viewAdminMain();
  attachHandlers();
}

const FARM_COLOR_PALETTE = [
  '#FBDCE2', '#FDF0C8', '#D9EAFB', '#DFF5E3', '#EEE0F8',
  '#FCE3D2', '#D7F3F0', '#E4E4FB', '#F5E6D3', '#E0F0D9'
];

function farmColor(name){
  if(!name) return null;
  let hash = 0;
  for(let i = 0; i < name.length; i++){
    hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  }
  return FARM_COLOR_PALETTE[hash % FARM_COLOR_PALETTE.length];
}

function premiumTag(p){
  if(p === 'G마크') return 'G';
  if(p === '무항생제') return '무항';
  if(p === '일반') return '일반';
  return '';
}

function premiumColor(p){
  if(p === 'G마크') return '#1B7A3D';
  if(p === '무항생제') return '#9A7B0A';
  if(p === '일반') return '#000000';
  return 'inherit';
}

function premiumDisplay(premium, animalWelfare){
  const tag = premiumTag(premium);
  if(!tag) return '';
  return animalWelfare ? tag + '(동물)' : tag;
}

function premiumSpan(premium, animalWelfare){
  const label = premiumDisplay(premium, animalWelfare);
  if(!label) return '';
  return `<span style="color:${premiumColor(premium)};font-weight:800;">${esc(label)}</span>`;
}

function chickenTag(t){
  if(t === '육계') return '육';
  if(t === '삼계') return '삼';
  return '';
}

function vehicleBlock(e){
  return `<div class="v-block"><span class="v-code">${esc(e.vehicleCode)}</span><span class="v-num">(${esc(e.vehicleNumber)})</span></div>`;
}

function sortEntriesForDisplay(line){
  const lineEntries = state.entries.filter(e => e.line === line);
  const done = lineEntries.filter(e => e.injectOrder !== null).sort((a, b) => a.injectOrder - b.injectOrder);
  const floor = lineEntries.filter(e => e.injectOrder === null && e.waitState !== '가입력').sort((a, b) => a.seq - b.seq);
  const pre = lineEntries.filter(e => e.injectOrder === null && e.waitState === '가입력').sort((a, b) => a.seq - b.seq);
  return [...done, ...floor, ...pre];
}

function orderBadge(e){
  if(e.injectOrder !== null){
    return `<div class="badge badge-done">${e.injectOrder}</div>`;
  }
  if(e.waitState === '가입력'){
    return `<div class="badge badge-pre">가입력</div>`;
  }
  return `<div class="badge badge-wait">바닥</div>`;
}

function orderValueOf(e){
  if(e.injectOrder !== null) return 'num:' + e.injectOrder;
  return e.waitState === '가입력' ? 'PRE' : 'FLOOR';
}

function parseOrderValue(v){
  if(v === 'PRE') return { injectOrder: null, waitState: '가입력' };
  if(v === 'FLOOR' || !v) return { injectOrder: null, waitState: '바닥' };
  return { injectOrder: parseInt(v.slice(4), 10), waitState: null };
}

function orderSelectOptionsHtml(line, excludeEntryId, currentValue){
  const numOptions = getOrderOptions(line, excludeEntryId);
  return `
    <option value="PRE" ${currentValue==='PRE'?'selected':''}>가입력 (아직 도착 전, 정보만 입력)</option>
    <option value="FLOOR" ${currentValue==='FLOOR'?'selected':''}>바닥 (도착해서 대기 중)</option>
    ${numOptions.map(n => `<option value="num:${n}" ${currentValue===('num:'+n)?'selected':''}>${n}번째 투입</option>`).join('')}
  `;
}

/* ---------- EVENT HANDLING ---------- */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', onAction);
  });
  document.querySelectorAll('[data-change]').forEach(el => {
    el.addEventListener('change', onChange);
  });
  const codeInput = document.getElementById('role-code');
  if(codeInput) codeInput.addEventListener('keydown', e => { if(e.key === 'Enter') doRoleLogin(); });
}

async function onChange(ev){
  const el = ev.currentTarget;
  const action = el.dataset.change;
  if(action === 'excel-file-select'){
    const file = el.files && el.files[0];
    if(!file) return;
    await handleExcelFile(file);
    return;
  }
  syncEntryFormInputs();
  if(action === 'ne-vehicle-select'){
    if(el.value === '__manual__'){
      state.newEntry.vehicleMode = 'manual';
      state.newEntry.vehicleCode = '';
    } else {
      state.newEntry.vehicleCode = el.value;
    }
    render();
  }
  else if(action === 'ne-farm-select'){
    if(el.value === '__manual__'){
      state.newEntry.farmMode = 'manual';
      state.newEntry.farmId = null;
    } else {
      state.newEntry.farmId = el.value;
    }
    render();
  }
}

async function onAction(ev){
  const el = ev.currentTarget;
  const action = el.dataset.action;
  if(!action) return;

  if(action === 'role-open'){
    state.loginRole = el.dataset.role;
    state.loginError = '';
    render();
    const inp = document.getElementById('role-code');
    if(inp) inp.focus();
  }
  else if(action === 'role-login'){
    await doRoleLogin();
  }
  else if(action === 'monitor-login'){
    await doMonitorLogin();
  }
  else if(action === 'logout'){
    try{ await firebase.auth().signOut(); }catch(e){}
    state.role = null;
    state.loginRole = null;
    state.view = 'login';
    state.loginError = '';
    render();
  }
  else if(action === 'set-worker-line'){
    state.workerLineTab = el.dataset.line;
    state.selectedIds = [];
    render();
  }
  else if(action === 'select-mode-start'){
    state.selectMode = true;
    state.selectedIds = [];
    render();
  }
  else if(action === 'select-mode-cancel'){
    state.selectMode = false;
    state.selectedIds = [];
    render();
  }
  else if(action === 'toggle-select'){
    const id = el.dataset.id;
    const idx = state.selectedIds.indexOf(id);
    if(idx === -1) state.selectedIds.push(id); else state.selectedIds.splice(idx, 1);
    render();
  }
  else if(action === 'select-all-toggle'){
    const line = el.dataset.line;
    const ids = sortEntriesForDisplay(line).map(e => e.id);
    const allSelected = ids.length > 0 && ids.every(id => state.selectedIds.includes(id));
    state.selectedIds = allSelected ? [] : ids.slice();
    render();
  }
  else if(action === 'select-delete'){
    if(state.selectedIds.length === 0) return;
    if(!confirm(`선택한 ${state.selectedIds.length}개 항목을 삭제하시겠습니까?\n삭제하면 되돌릴 수 없습니다.`)) return;
    state.entries = state.entries.filter(e => !state.selectedIds.includes(e.id));
    const dateToSave = (state.role === 'admin' && state.adminTab === 'entries') ? state.entriesManageDate : state.date;
    await saveEntries(dateToSave, state.entries);
    state.selectedIds = [];
    state.selectMode = false;
    state.lastSynced = new Date();
    render();
  }
  else if(action === 'set-admin-entries-line'){
    state.adminEntriesLine = el.dataset.line;
    state.selectedIds = [];
    render();
  }
  else if(action === 'entries-date-refresh'){
    const dateInput = document.getElementById('entries-manage-date');
    const date = dateInput ? dateInput.value : state.entriesManageDate;
    if(date && date !== state.entriesManageDate){
      if(!confirm(`${formatDateKorean(date)} 도계 맞습니까?`)){
        if(dateInput) dateInput.value = state.entriesManageDate;
        return;
      }
    }
    if(date) state.entriesManageDate = date;
    await loadEntries(state.entriesManageDate);
    state.selectedIds = [];
    state.lastSynced = new Date();
    render();
  }
  else if(action === 'set-inspector-line'){
    state.inspectorLineTab = el.dataset.line;
    render();
  }
  else if(action === 'inspect-complete'){
    if(state.role !== 'inspector') return;
    const line = el.dataset.line;
    const body = document.querySelector(`.wm-col-body[data-line="${line}"]`);
    if(!body) return;
    const checked = Array.from(body.querySelectorAll('.insp-checkbox:checked')).map(cb => cb.dataset.id);
    if(checked.length === 0) return;
    checked.forEach(id => {
      const e = state.entries.find(x => x.id === id);
      if(e) e.inspected = true;
    });
    await saveEntries(state.date, state.entries);
    state.lastSynced = new Date();
    render();
  }
  else if(action === 'inspect-cancel'){
    if(state.role !== 'inspector') return;
    const line = el.dataset.line;
    const body = document.querySelector(`.wm-col-body[data-line="${line}"]`);
    if(!body) return;
    const checked = Array.from(body.querySelectorAll('.insp-checkbox:checked')).map(cb => cb.dataset.id);
    if(checked.length === 0) return;
    checked.forEach(id => {
      const e = state.entries.find(x => x.id === id);
      if(e) e.inspected = false;
    });
    await saveEntries(state.date, state.entries);
    state.lastSynced = new Date();
    render();
  }
  else if(action === 'worker-refresh'){
    const dateInput = document.getElementById('worker-date');
    const date = dateInput ? dateInput.value : state.date;
    if(date && date !== state.date){
      if(!confirm(`${formatDateKorean(date)} 도계 맞습니까?`)){
        if(dateInput) dateInput.value = state.date;
        return;
      }
    }
    if(date) state.date = date;
    await loadVehicles();
    await loadFarms(state.date);
    await loadEntries(state.date);
    await loadClosed(state.date);
    state.lastSynced = new Date();
    render();
  }
  else if(action === 'close-line'){
    if(state.role === 'monitor') return;
    const line = el.dataset.line;
    if(!confirm(`${state.date} ${line} 입고 작업을 마감하시겠습니까?\n마감 후에는 등록/수정이 불가능합니다.`)) return;
    const newClosed = { ...state.closedByLine, [line]: true };
    const ok = await saveClosed(state.date, newClosed);
    if(ok){
      state.closedByLine = newClosed;
      render();
    } else {
      alert('마감 처리에 실패했습니다. 인터넷 연결을 확인해주세요.');
    }
  }
  else if(action === 'reopen-line'){
    if(state.role === 'monitor') return;
    const line = el.dataset.line;
    if(!confirm(`${line} 마감을 해지하시겠습니까?`)) return;
    const newClosed = { ...state.closedByLine, [line]: false };
    const ok = await saveClosed(state.date, newClosed);
    if(ok){
      state.closedByLine = newClosed;
      render();
    } else {
      alert('처리에 실패했습니다. 인터넷 연결을 확인해주세요.');
    }
  }
  else if(action === 'new-entry'){
    const line = el.dataset.line || '2라인';
    if(state.closedByLine[line] || state.role === 'monitor') return;
    await loadVehicles();
    await loadFarms(state.date);
    state.lastSynced = new Date();
    state.newEntry = {
      line,
      vehicleMode: Object.keys(state.vehicles).length ? 'list' : 'manual',
      vehicleCode: '',
      vehicleCodeManual: '',
      vehicleNumberManual: '',
      farmMode: state.farms.length ? 'list' : 'manual',
      farmId: null,
      farmNameManual: '',
      premiumManual: 'G마크',
      animalWelfareManual: false,
      avgWeightManual: '',
      chickenTypeManual: '육계',
      order: 'FLOOR',
      forceOrder: ''
    };
    state.formErrors = {};
    state.view = 'entryForm';
    render();
  }
  else if(action === 'cancel-entry'){
    state.view = 'workerMain';
    render();
  }
  else if(action === 'ne-vehicle-back-list'){
    syncEntryFormInputs();
    state.newEntry.vehicleMode = 'list';
    render();
  }
  else if(action === 'ne-farm-back-list'){
    syncEntryFormInputs();
    state.newEntry.farmMode = 'list';
    state.newEntry.farmId = null;
    render();
  }
  else if(action === 'save-entry'){
    syncEntryFormInputs();
    await handleSaveEntry();
  }
  else if(action === 'open-confirm'){
    if(state.role === 'monitor') return;
    const id = el.dataset.id;
    if(!id) return;
    const e = state.entries.find(x => x.id === id);
    if(!e) return;
    if(state.closedByLine[e.line]) return;
    state.confirmEntryId = id;
    state.view = 'confirmInject';
    render();
  }
  else if(action === 'cancel-confirm'){
    state.view = 'workerMain';
    render();
  }
  else if(action === 'confirm-line'){
    const e = state.entries.find(x => x.id === state.confirmEntryId);
    if(e && e.line !== el.dataset.line){
      e.line = el.dataset.line;
      e.injectOrder = null;
      e.waitState = '바닥';
      e.status = '대기';
      render();
    }
  }
  else if(action === 'do-confirm'){
    if(state.role === 'monitor') return;
    const e = state.entries.find(x => x.id === state.confirmEntryId);
    if(state.closedByLine[e.line]) return;
    const sel = document.getElementById('confirm-order');
    let { injectOrder, waitState } = parseOrderValue(sel.value);

    const forceSel = document.getElementById('confirm-force-order');
    const forceVal = forceSel ? forceSel.value : '';
    if(forceVal){
      const forcedPos = parseInt(forceVal, 10);
      shiftOrdersFrom(e.line, forcedPos, e.id);
      injectOrder = forcedPos;
      waitState = null;
    }

    e.injectOrder = injectOrder;
    e.waitState = waitState;
    e.status = injectOrder ? '투입완료' : '대기';
    await saveEntries(state.date, state.entries);
    state.lastSynced = new Date();
    state.view = 'workerMain';
    render();
    scrollToBottom();
  }
  else if(action === 'admin-tab'){
    state.adminTab = el.dataset.tab;
    state.selectedIds = [];
    if(el.dataset.tab === 'entries'){
      await loadEntries(state.entriesManageDate);
      state.lastSynced = new Date();
    }
    render();
  }
  else if(action === 'excel-cancel'){
    state.excelImport = null;
    render();
  }
  else if(action === 'excel-commit'){
    const dateInput = document.getElementById('excel-import-date');
    const targetDate = dateInput ? dateInput.value : state.excelImport.date;
    const totalVehicles = state.excelImport.farms.reduce((s, f) => s + f.vehicles.length, 0);
    if(!confirm(`${formatDateKorean(targetDate)} 도계로 농가 ${state.excelImport.farms.length}곳, 차량 ${totalVehicles}대를 일괄 등록하시겠습니까?`)) return;

    await loadVehicles();
    await loadFarms(targetDate);
    await loadEntries(targetDate);

    const newFarms = [...state.farms];
    const newEntries = [...state.entries];
    const seqCounters = {
      '1라인': newEntries.filter(e => e.line === '1라인').length,
      '2라인': newEntries.filter(e => e.line === '2라인').length
    };

    state.excelImport.farms.forEach(f => {
      newFarms.push({
        id: uid(),
        name: f.name,
        premium: f.premium,
        chickenType: f.chickenType,
        animalWelfare: f.animalWelfare,
        avgWeight: f.avgWeight
      });

      f.vehicles.forEach((v, idx) => {
        if(!state.vehicles[v.number]){
          state.vehicles[v.number] = v.code;
        }
        seqCounters[f.line] = (seqCounters[f.line] || 0) + 1;
        newEntries.push({
          id: uid(),
          date: targetDate,
          line: f.line,
          seq: seqCounters[f.line],
          vehicleNumber: v.number,
          vehicleCode: v.code,
          farmName: f.name,
          premium: f.premium,
          chickenType: f.chickenType,
          animalWelfare: f.animalWelfare,
          weight: f.avgWeight,
          transportRoute: idx === 0 ? f.transportRoute : null,
          workTime: idx === 0 ? f.workTime : null,
          status: '대기',
          injectOrder: null,
          waitState: '가입력',
          inspected: false
        });
      });
    });

    await saveVehicles();
    await saveFarms(targetDate, newFarms);
    await saveEntries(targetDate, newEntries);

    state.farms = newFarms;
    state.entries = newEntries;
    state.farmDate = targetDate;
    state.excelImport = null;
    state.lastSynced = new Date();
    render();
    alert('일괄 등록이 완료되었습니다.');
  }
  else if(action === 'farm-add'){
    const name = document.getElementById('farm-name').value.trim();
    const premium = document.getElementById('farm-premium').value;
    const chickenType = document.getElementById('farm-chicken-type').value;
    const animalWelfare = document.getElementById('farm-animal-welfare').checked;
    const avgWeightRaw = document.getElementById('farm-avg-weight').value.trim();
    if(!name) return;
    if(!avgWeightRaw || isNaN(parseFloat(avgWeightRaw))){
      alert('대표 평체를 숫자로 입력해주세요.');
      return;
    }
    const avgWeight = parseFloat(avgWeightRaw);
    state.farms.push({ id: uid(), name, premium, chickenType, animalWelfare, avgWeight });
    await saveFarms(state.farmDate, state.farms);
    state.farmDraft = { name: '', premium: 'G마크', chickenType: '육계', animalWelfare: false, avgWeight: '' };
    render();
  }
  else if(action === 'farm-date-shortcut'){
    const offset = parseInt(el.dataset.offset, 10) || 0;
    const d = new Date();
    d.setDate(d.getDate() + offset);
    const dateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if(dateStr !== state.farmDate){
      if(!confirm(`${formatDateKorean(dateStr)} 도계 맞습니까?`)) return;
    }
    state.farmDate = dateStr;
    await loadFarms(state.farmDate);
    state.lastSynced = new Date();
    render();
  }
  else if(action === 'farm-refresh'){
    const dateInput = document.getElementById('farm-date');
    const date = dateInput ? dateInput.value : state.farmDate;
    if(date && date !== state.farmDate){
      if(!confirm(`${formatDateKorean(date)} 도계 맞습니까?`)){
        if(dateInput) dateInput.value = state.farmDate;
        return;
      }
    }
    if(date) state.farmDate = date;
    await loadFarms(state.farmDate);
    state.lastSynced = new Date();
    render();
  }
  else if(action === 'farm-save'){
    const ok = await saveFarms(state.farmDate, state.farms);
    if(ok){
      alert('저장되었습니다.');
    } else {
      alert('저장에 실패했습니다. 인터넷 연결을 확인해주세요.');
    }
  }
  else if(action === 'farm-delete'){
    const id = el.dataset.id;
    const target = state.farms.find(f => f.id === id);
    const label = target ? target.name : '이 농가';
    if(!confirm(`${label}을(를) 정말로 삭제하시겠습니까?`)) return;
    state.farms = state.farms.filter(f => f.id !== id);
    await saveFarms(state.farmDate, state.farms);
    render();
  }
  else if(action === 'vehicle-add'){
    const num = document.getElementById('vehicle-number').value.trim();
    const code = document.getElementById('vehicle-code').value.trim();
    if(!num || !code) return;
    state.vehicles[num] = code;
    await saveVehicles();
    state.vehicleDraft = { number: '', code: '' };
    render();
  }
  else if(action === 'vehicle-delete'){
    const num = el.dataset.num;
    const code = state.vehicles[num];
    if(!confirm(`차량번호 ${num}(${code})을(를) 정말로 삭제하시겠습니까?`)) return;
    delete state.vehicles[num];
    await saveVehicles();
    render();
  }
  else if(action === 'vehicle-refresh'){
    await loadVehicles();
    state.lastSynced = new Date();
    render();
  }
  else if(action === 'vehicle-reset'){
    const ok = confirm('현재 차량 데이터를 모두 지우고 기본 39개 목록으로 초기화할까요?');
    if(!ok) return;
    state.vehicles = { ...SEED_VEHICLES };
    await saveVehicles();
    render();
  }
}

async function doRoleLogin(){
  const codeInput = document.getElementById('role-code');
  const code = codeInput ? codeInput.value.trim() : '';
  const role = state.loginRole;
  try{
    const cred = await firebase.auth().signInAnonymously();
    const uid = cred.user.uid;
    await db.ref('roles/' + uid).set({ role, code });

    state.role = role;
    state.loginError = '';

    if(role === 'worker'){
      await loadVehicles();
      await loadFarms(state.date);
      await loadEntries(state.date);
      await loadClosed(state.date);
      state.view = 'workerMain';
    } else if(role === 'inspector'){
      await loadEntries(state.date);
      state.view = 'inspectorMain';
    } else if(role === 'admin'){
      await loadVehicles();
      await loadFarms(state.farmDate);
      state.view = 'adminMain';
    }
    state.lastSynced = new Date();
    render();
    pollTick();
  } catch(e){
    console.error('role login error', e);
    state.loginError = '코드가 올바르지 않습니다.';
    render();
  }
}

function sortedVehicleCodes(){
  const codes = [...new Set(Object.values(state.vehicles))];
  return codes.sort((a, b) => {
    const pa = a.match(/^([A-Za-z]+)-?(\d+)$/);
    const pb = b.match(/^([A-Za-z]+)-?(\d+)$/);
    if(pa && pb){
      if(pa[1] !== pb[1]) return pa[1].localeCompare(pb[1]);
      return parseInt(pa[2], 10) - parseInt(pb[2], 10);
    }
    return a.localeCompare(b);
  });
}

function findNumberByCode(code){
  const target = code.trim().toUpperCase();
  const match = Object.entries(state.vehicles).find(([num, c]) => c.trim().toUpperCase() === target);
  return match ? match[0] : null;
}

function usedOrders(line, excludeEntryId){
  return state.entries
    .filter(e => e.line === line && e.id !== excludeEntryId && e.injectOrder !== null)
    .map(e => e.injectOrder)
    .sort((a, b) => a - b);
}

function shiftOrdersFrom(line, fromPosition, excludeEntryId){
  state.entries.forEach(e => {
    if(e.line === line && e.id !== excludeEntryId && e.injectOrder !== null && e.injectOrder >= fromPosition){
      e.injectOrder += 1;
    }
  });
}

function getOrderOptions(line, excludeEntryId){
  const used = state.entries
    .filter(e => e.line === line && e.injectOrder !== null && e.id !== excludeEntryId)
    .map(e => e.injectOrder);
  const usedSet = new Set(used);
  const totalCount = state.entries.filter(e => e.line === line).length;
  const maxUsed = used.length ? Math.max(...used) : 0;
  const upper = Math.max(maxUsed, totalCount) + 5;
  const options = [];
  for(let i = 1; i <= upper; i++){
    if(!usedSet.has(i)) options.push(i);
  }
  return options;
}

async function handleSaveEntry(){
  const ne = state.newEntry;
  if(state.closedByLine[ne.line]){
    alert('마감된 라인입니다. 등록할 수 없습니다.');
    return;
  }
  if(state.role === 'monitor') return;
  const errs = {};

  let vehicleCode, vehicleNumber;
  if(ne.vehicleMode === 'list'){
    vehicleCode = ne.vehicleCode;
    vehicleNumber = vehicleCode ? findNumberByCode(vehicleCode) : null;
    if(!vehicleCode || !vehicleNumber) errs.vehicle = '차량 코드를 선택해주세요.';
  } else {
    vehicleCode = ne.vehicleCodeManual;
    vehicleNumber = ne.vehicleNumberManual;
    if(!vehicleCode || !vehicleNumber) errs.vehicle = '차량 코드와 번호를 입력해주세요.';
  }

  let farmName = '', premium = '', chickenType = '', animalWelfare = false, weight = null;
  if(ne.farmMode === 'list'){
    const f = state.farms.find(x => x.id === ne.farmId);
    if(!f) errs.farm = '농가를 선택하거나 직접 입력해주세요.';
    else { farmName = f.name; premium = f.premium; chickenType = f.chickenType || ''; animalWelfare = !!f.animalWelfare; weight = (f.avgWeight === undefined || f.avgWeight === null) ? null : f.avgWeight; }
  } else {
    if(!ne.farmNameManual || !ne.farmNameManual.trim()) errs.farm = '농가명을 입력해주세요.';
    else { farmName = ne.farmNameManual.trim(); premium = ne.premiumManual; chickenType = ne.chickenTypeManual; animalWelfare = !!ne.animalWelfareManual; }
    if(!ne.avgWeightManual || isNaN(parseFloat(ne.avgWeightManual))) errs.weight = '평체를 숫자로 입력해주세요.';
    else weight = parseFloat(ne.avgWeightManual);
  }

  if(Object.keys(errs).length){
    state.formErrors = errs;
    render();
    return;
  }

  if(!state.vehicles[vehicleNumber]){
    state.vehicles[vehicleNumber] = vehicleCode;
    await saveVehicles();
  }

  const seq = state.entries.filter(e => e.line === ne.line).length + 1;
  let { injectOrder, waitState } = parseOrderValue(ne.order);

  if(ne.forceOrder){
    const forcedPos = parseInt(ne.forceOrder, 10);
    shiftOrdersFrom(ne.line, forcedPos, null);
    injectOrder = forcedPos;
    waitState = null;
  }

  const entry = {
    id: uid(),
    date: state.date,
    line: ne.line,
    seq,
    vehicleNumber,
    vehicleCode,
    farmName,
    premium,
    chickenType,
    animalWelfare,
    weight,
    status: injectOrder ? '투입완료' : '대기',
    injectOrder,
    waitState,
    inspected: false
  };
  state.entries.push(entry);
  await saveEntries(state.date, state.entries);
  state.lastSynced = new Date();
  state.view = 'workerMain';
  render();
  scrollToBottom();
}

const POLL_MS = 5000;
let polling = false;

async function pollTick(){
  if(polling) return;
  if(!state.role) return;
  if(state.view !== 'workerMain' && state.view !== 'inspectorMain' && state.view !== 'adminMain') return;

  polling = true;
  try{
    const before = JSON.stringify({ v: state.vehicles, f: state.farms, e: state.entries, c: state.closedByLine });

    if(state.view === 'workerMain'){
      await loadVehicles();
      await loadFarms(state.date);
      await loadEntries(state.date);
      await loadClosed(state.date);
    } else if(state.view === 'inspectorMain'){
      await loadEntries(state.date);
    } else if(state.view === 'adminMain'){
      syncAdminDraftInputs();
      await loadVehicles();
      await loadFarms(state.farmDate);
      if(state.adminTab === 'entries'){
        await loadEntries(state.entriesManageDate);
      }
    }

    const after = JSON.stringify({ v: state.vehicles, f: state.farms, e: state.entries, c: state.closedByLine });
    state.lastSynced = new Date();
    if(after !== before){
      render();
    } else {
      const ind = document.querySelector('.sync-time');
      if(ind) ind.textContent = '● 실시간 동기화 · ' + formatTime(state.lastSynced);
    }
  } finally {
    polling = false;
  }
}

setInterval(pollTick, POLL_MS);

let authRestoreAttempted = false;
firebase.auth().onAuthStateChanged(async (user) => {
  if(authRestoreAttempted) return;
  authRestoreAttempted = true;
  if(!user || state.role) return;
  try{
    const snap = await db.ref('roles/' + user.uid).once('value');
    const data = snap.val();
    if(!data || !data.role) return;

    state.role = data.role;
    if(state.role === 'worker' || state.role === 'monitor'){
      await loadVehicles();
      await loadFarms(state.date);
      await loadEntries(state.date);
      await loadClosed(state.date);
      state.view = 'workerMain';
    } else if(state.role === 'inspector'){
      await loadEntries(state.date);
      state.view = 'inspectorMain';
    } else if(state.role === 'admin'){
      await loadVehicles();
      await loadFarms(state.farmDate);
      state.view = 'adminMain';
    } else {
      state.role = null;
      return;
    }
    state.lastSynced = new Date();
    render();
    pollTick();
  }catch(e){
    console.error('auto-login restore error', e);
  }
});

render();
